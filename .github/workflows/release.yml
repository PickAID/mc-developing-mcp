name: Release on version change

on:
  push:
    branches: [main]
    paths: ["version.json"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Defaults to version in version.json."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Read version ────────────────────────────────────────────────────
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 - <<'PYEOF'
          import json
          from pathlib import Path

          raw = Path("version.json").read_text(encoding="utf-8").strip()
          if raw.startswith("{"):
              obj = json.loads(raw)
              print(str(obj.get("version", "")).strip())
          else:
              print(raw)
          PYEOF
          )
          if [ -z "$VERSION" ]; then
            echo "Error: version.json is empty or invalid"
            exit 1
          fi
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

      # ── 3. Skip if release already exists ─────────────────────────────────
      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" &>/dev/null; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Build lite zip ──────────────────────────────────────────────────
      # Includes: code, docs, references, config, minecraft_docs.sqlite
      # NEVER includes: sources/ (raw Java), minecraft_sources.sqlite,
      #                 .git/, __pycache__, *.pyc, reports/, *.zip, WAL/SHM
      - name: Build lite zip
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 - <<'EOF'
          import os, zipfile
          from pathlib import Path

          tag      = os.environ["RELEASE_TAG"]
          root     = Path(".")
          zip_name = f"mc-developing-mcp-lite-{tag}.zip"

          BLOCKED_DIRS  = {"sources", ".git", "__pycache__", "reports"}
          BLOCKED_EXTS  = {".pyc", ".pyo", ".sqlite-wal", ".sqlite-shm"}
          BLOCKED_NAMES = {".DS_Store"}
          BLOCKED_FILES = {"data/minecraft_sources.sqlite"}

          total = 0
          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  rel     = path.relative_to(root)
                  rel_str = str(rel)
                  if rel.parts[0] in BLOCKED_DIRS:       continue
                  if rel.suffix == ".zip":                continue
                  if rel.suffix in BLOCKED_EXTS:          continue
                  if rel.name   in BLOCKED_NAMES:         continue
                  if rel_str    in BLOCKED_FILES:         continue
                  if "__pycache__" in rel.parts:          continue
                  zf.write(path, rel_str)
                  total += 1

          mb = Path(zip_name).stat().st_size / 1024 / 1024
          print(f"Created {zip_name}: {total} files, {mb:.1f} MB")
          EOF

      # ── 5. Create GitHub Release + upload ─────────────────────────────────
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"

          # Write release notes in shell to keep YAML/simple quoting robust
          cat > release_notes.md <<EOF
          ## mc-developing-mcp ${VERSION}

          ### Uploaded by this workflow

          | File | Contents | Size |
          |---|---|---|
          | mc-developing-mcp-lite-${TAG}.zip | Code + docs DB (no sources DB) | ~30 MB |
          | minecraft_docs.sqlite | Docs database standalone | ~16 MB |

          ### Large assets (sources DB + full zip)

          | File | CI behavior |
          |---|---|
          | minecraft_sources.sqlite | CI copies it from the latest previous release that has this asset |
          | mc-developing-mcp-full-${TAG}.zip | CI builds/uploads it only when minecraft_sources.sqlite is available |

          Bootstrap is local-first. If no previous release has minecraft_sources.sqlite, run this once locally:

          ```bash
          python scripts/upload_full_release.py --tag ${TAG}
          ```

          > **Note**: Raw Java source files (sources/) are **never** included in any release or zip.
          > Only pre-built SQLite databases are distributed.

          ### Quick start

          **Local mode** (has databases):
          1. Download lite zip or full zip and extract
          2. If lite: run python scripts/download_release.py to fetch minecraft_sources.sqlite
          3. Configure AI client - see [READMEEN.md](.github/READMEEN.md)

          **Remote mode** (no local databases):
          1. Server device: python mcp_server/http_server.py
          2. Client device: set remote_url in config.json, use remote_proxy.py
          3. See [Remote Mode](.github/READMEEN.md#remote-mode)
          EOF

          LITE_ZIP="mc-developing-mcp-lite-${TAG}.zip"

          gh release create "$TAG" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            "$LITE_ZIP"

          if [ -f data/minecraft_docs.sqlite ]; then
            gh release upload "$TAG" data/minecraft_docs.sqlite
            echo "Uploaded minecraft_docs.sqlite"
          fi

          rm -f release_notes.md
          echo ""
          echo "Lite release created. Next step will try to auto-upload full assets from previous release."

      - name: Upload full assets from previous release (auto-carry)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          mkdir -p data

          SOURCE_TAG=""
          while IFS= read -r CANDIDATE; do
            [ -z "$CANDIDATE" ] && continue
            [ "$CANDIDATE" = "$TAG" ] && continue
            if gh release view "$CANDIDATE" --json assets --jq '.assets[].name' | grep -qx 'minecraft_sources.sqlite'; then
              SOURCE_TAG="$CANDIDATE"
              break
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          if [ -z "$SOURCE_TAG" ]; then
            echo "No previous release contains minecraft_sources.sqlite; skipping full asset upload."
            echo "Bootstrap must be local-first (one time): python scripts/upload_full_release.py --tag $TAG"
            exit 0
          else
            echo "Using minecraft_sources.sqlite from release: $SOURCE_TAG"
            gh release download "$SOURCE_TAG" --pattern 'minecraft_sources.sqlite' --dir data --clobber
          fi

          python3 - <<'PYEOF'
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          root = Path('.')
          zip_name = f'mc-developing-mcp-full-{tag}.zip'

          blocked_dirs = {'sources', '.git', '__pycache__', 'reports'}
          blocked_exts = {'.pyc', '.pyo', '.sqlite-wal', '.sqlite-shm'}
          blocked_names = {'.DS_Store'}

          total = 0
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED, compresslevel=1) as zf:
            for path in sorted(root.rglob('*')):
              if not path.is_file():
                continue
              rel = path.relative_to(root)
              rel_str = str(rel)

              if rel.parts[0] in blocked_dirs:
                continue
              if rel.suffix == '.zip':
                continue
              if rel.suffix in blocked_exts:
                continue
              if rel.name in blocked_names:
                continue
              if '__pycache__' in rel.parts:
                continue

              zf.write(path, rel_str)
              total += 1

          size_mb = Path(zip_name).stat().st_size / 1024 / 1024
          print(f'Created {zip_name}: {total} files, {size_mb:.1f} MB')
          PYEOF

          gh release upload "$TAG" data/minecraft_sources.sqlite "mc-developing-mcp-full-${TAG}.zip" --clobber
          rm -f "mc-developing-mcp-full-${TAG}.zip"
          echo "Uploaded minecraft_sources.sqlite and full zip to $TAG"
