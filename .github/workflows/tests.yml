name: Tests

on:
  push:
    branches: [main]
    paths:
      - "mcp_server/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - "mcp_server/**"
      - "scripts/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Build fixture DB and run tests
        run: python -m pytest tests/test_indexer.py tests/test_queries.py -v
        env:
          PYTHONPATH: mcp_server
